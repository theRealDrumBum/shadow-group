openapi: 3.1.0
info:
  title: Shadow Group Card Registry API
  version: 1.3.0
servers:
  - url: https://YOUR-VERCEL-DOMAIN.vercel.app
paths:
  /api/cards/sync:
    get:
      operationId: findCardInRegistry
      summary: Look up a card and read every version's approval status, artwork, and preview URL
      description: >
        Call this before creating a card or proposing a new version, and again
        after submitting to check review status. With a Bearer token and no
        query params, this returns `{ ready: true }` so you can confirm the
        Action URL and API key before looking up a card. With `syncKey` or
        `slug`, the response includes the full card record with every version
        under `card_versions`, each carrying its `status` (draft, generating,
        submitted, changes_requested, approved, rejected, archived),
        `review_notes`, `version_number`, `previewUrl`, and `artworkUrl` when
        art was uploaded. Use `review_notes` to understand what to fix, then
        resubmit a new version with the same syncKey. Always show `previewUrl`
        to the user so they can see the card face on the website.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: syncKey
          schema: { type: string }
        - in: query
          name: slug
          schema: { type: string }
      responses:
        '200':
          description: Registry lookup, or a readiness check when no query is sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  configured: { type: boolean }
                  message: { type: string }
                  exists: { type: boolean }
                  matches:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id: { type: string }
                        sync_key: { type: string }
                        slug: { type: string }
                        name: { type: string }
                        status: { type: string }
                        canonical_version_id: { type: [string, 'null'] }
                        current_version_id: { type: [string, 'null'] }
                        previewUrl: { type: [string, 'null'] }
                        galleryUrl: { type: [string, 'null'] }
                        card_versions:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                            properties:
                              id: { type: string }
                              version_number: { type: integer }
                              status: { type: string }
                              review_notes: { type: [string, 'null'] }
                              previewUrl: { type: [string, 'null'] }
                              artworkUrl: { type: [string, 'null'] }
        '401': { description: Missing or invalid API key }
        '503': { description: CARD_SYNC_API_KEY or Supabase is not configured on the server }
    post:
      operationId: synchronizeCard
      summary: Create a new registry card or append a proposed version to an existing card
      description: >
        The operation never changes the canonical version. Every submitted version
        requires administrator approval. Include artworkUrl (HTTPS image generated
        in this chat) or artworkBase64 so the website can render a visual card
        face. The response `previewUrl` is a shareable page showing that version
        on the Shadow Group site — always give it to the user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardSyncPayload'
      responses:
        '200': { description: Proposed version appended to an existing card, including previewUrl }
        '201': { description: New card and first proposed version created, including previewUrl }
        '401': { description: Missing or invalid API key }
        '503': { description: CARD_SYNC_API_KEY or Supabase is not configured on the server }
  /api/cards/sync/assets:
    post:
      operationId: uploadCardArtwork
      summary: Attach artwork to the current (or specified) working version of a card
      description: >
        Use this when you generate art after synchronizeCard, or when a previous
        artwork upload failed. Downloads an HTTPS image URL (or decodes base64)
        into the public card-assets bucket and links it to the version. Only
        draft, generating, submitted, or changes_requested versions accept new art.
        The response includes previewUrl so the user can refresh the card face.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardArtworkPayload'
      responses:
        '200': { description: Artwork stored and linked to the version }
        '400': { description: Missing syncKey or invalid image }
        '404': { description: Card or version not found }
        '409': { description: Version is canonical/archived and cannot receive new art }
  /api/cards:
    get:
      operationId: listApprovedCards
      summary: List cards using only their approved canonical versions
      parameters:
        - in: query
          name: expansion
          schema: { type: string }
        - in: query
          name: callsign
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: Approved canonical cards, each including a resolved render_url when artwork exists }
  /api/cards/random:
    get:
      operationId: getRandomApprovedCard
      summary: Return one random complete card using its approved canonical version
      description: Each card includes a resolved `render_url` for its primary artwork when available.
      parameters:
        - in: query
          name: expansion
          schema: { type: string }
      responses:
        '200': { description: Random canonical card (with render_url) or null when the registry is empty }
  /api/cards/lookup:
    get:
      operationId: lookupApprovedCard
      summary: Public lookup of approved cards by syncKey, slug, name, or callsign
      description: >
        Returns only approved canonical cards from the public gallery view.
        Unlike /api/cards/sync, this endpoint never exposes unapproved drafts and
        does not require the API key. Each match includes a resolved `render_url`.
      parameters:
        - in: query
          name: syncKey
          schema: { type: string }
        - in: query
          name: slug
          schema: { type: string }
        - in: query
          name: name
          schema: { type: string }
        - in: query
          name: callsign
          schema: { type: string }
      responses:
        '200':
          description: Approved cards matching the query
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists: { type: boolean }
                  matches:
                    type: array
                    items: { type: object, additionalProperties: true }
        '400': { description: No query parameter provided }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CardArtworkPayload:
      type: object
      required: [syncKey]
      properties:
        syncKey:
          type: string
          description: The same stable syncKey used when the card was created.
        versionId:
          type: string
          description: Optional version UUID. Defaults to the card's current working version.
        kind:
          type: string
          enum: [artwork, render, thumbnail, alternate, reference]
          default: artwork
        artworkUrl:
          type: string
          description: HTTPS URL of a JPEG, PNG, WebP, or GIF. The server downloads and stores it immediately.
        artworkBase64:
          type: string
          description: Raw base64 or a data URL (data:image/png;base64,...) of the card art.
        artworkMimeType:
          type: string
          description: Optional MIME type when sending base64 without a data URL prefix.
    CardSyncPayload:
      type: object
      required: [syncKey, card, operator, version]
      properties:
        syncKey:
          type: string
          description: Stable identity for the card across every revision. Reuse this exact value when creating v2, v3, and later versions.
        card:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
            collectorNumber: { type: [string, 'null'] }
        operator:
          type: object
          required: [callsign, slug]
          properties:
            callsign: { type: string }
            slug: { type: string }
            displayName: { type: [string, 'null'] }
            bio: { type: [string, 'null'] }
            teamRole: { type: [string, 'null'] }
        expansion:
          anyOf:
            - type: 'null'
            - type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                description: { type: [string, 'null'] }
        facts:
          type: array
          items:
            type: object
            required: [category, fact]
            properties:
              category:
                type: string
                enum: [strength, weakness, personality, gear, appearance, quote, story, role, running_joke]
              fact: { type: string }
              source: { type: [string, 'null'] }
              approved: { type: boolean }
        assets:
          type: array
          description: Optional extra images to store with this version (in addition to version.artworkUrl).
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [artwork, render, thumbnail, alternate, reference]
              url: { type: string }
              base64: { type: string }
              mimeType: { type: string }
        version:
          type: object
          required: [typeLine]
          properties:
            status:
              type: string
              enum: [draft, generating, submitted, changes_requested]
              description: GPTs may only create non-canonical proposed versions. Use submitted when ready for administrator review.
            manaCost: { type: [string, 'null'] }
            colorIdentity:
              type: array
              items: { type: string }
            typeLine: { type: string }
            rulesText:
              type: array
              items: { type: string }
            flavorText: { type: [string, 'null'] }
            power: { type: [string, 'null'] }
            toughness: { type: [string, 'null'] }
            rarity: { type: [string, 'null'] }
            factsSnapshot: { type: object, additionalProperties: true }
            artPrompt: { type: [string, 'null'] }
            rendererData: { type: object, additionalProperties: true }
            artworkUrl:
              type: [string, 'null']
              description: HTTPS URL of generated or uploaded card art. The server downloads and stores it, then the preview page uses it as the card face.
            artworkBase64:
              type: [string, 'null']
              description: Base64 or data-URL image if no HTTPS URL is available.
            artworkMimeType:
              type: [string, 'null']
